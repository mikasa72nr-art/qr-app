<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場QR入力 ＆ 集計管理アプリ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --accent-green: #00E676;
      --accent-orange: #FF6D00;
      --accent-blue: #29B6F6;
      --accent-yellow: #FFD600;
      --text-main: #FFFFFF;
      --text-sub: #AAAAAA;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding-bottom: 60px;
    }
    h2 { font-size: 1.1rem; color: var(--accent-green); margin: 0 0 10px 0; }
    
    .summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
    }
    .summary-title { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-value { font-size: 2rem; font-weight: bold; color: var(--accent-yellow); }

    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-top: 8px; }
    textarea {
      width: 100%;
      font-size: 1rem;
      padding: 10px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-top: 4px;
      height: 90px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent-green); }

    .input-guide-bar {
      background-color: #263238;
      border: 1px solid #37474F;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--accent-green);
      font-weight: bold;
    }

    .option-bar {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-main {
      flex: 1;
      padding: 14px;
      background-color: var(--accent-orange);
      color: #FFF;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-main:active { opacity: 0.8; }

    .qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
    }
    #qrcode {
      background-color: #FFFFFF;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
    }
    #qrcode img, #qrcode canvas {
      width: 250px !important;
      height: 250px !important;
      display: block;
      image-rendering: pixelated;
    }
    .qr-info { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; text-align: center; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .btn-action {
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-combine { background-color: var(--accent-blue); color: #000; }
    .btn-delete-sub { background-color: #FF9800; color: #000; }
    .btn-clear { background-color: #D32F2F; color: #FFF; }

    .history-list { margin-top: 10px; }
    .history-card {
      background-color: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid var(--accent-green);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-checkbox { width: 20px; height: 20px; accent-color: var(--accent-blue); }
    .history-content { flex: 1; cursor: pointer; }
    .history-card-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .history-data { font-weight: bold; word-break: break-all; }
    
    .btn-edit {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>📱 現場データ入力 ＆ 集計管理</h2>

  <div class="summary-card">
    <div class="summary-title">現在のトータル数量</div>
    <div class="summary-value" id="totalQty">0</div>
  </div>

  <div class="input-guide-bar">
    📌 入力順: 品名 ➔ 数量 ➔ 注番
  </div>

  <label for="inputText">データ入力（カンマ区切り / スペース自動削除）</label>
  <textarea id="inputText" placeholder="入力例:&#10;01707300, 56, A234556&#10;または内部コード単体: 2600002046"></textarea>

  <div class="option-bar">
    <input type="checkbox" id="forceString" checked>
    <label for="forceString" style="display:inline; margin:0; cursor:pointer;">Excel頭ゼロ保持（数字品番の先頭に ' を付与）</label>
  </div>

  <div class="btn-group">
    <button class="btn-main" onclick="processAndSave()">保存してQR表示</button>
  </div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
    <div class="qr-info" id="qrStatus">データを入力して「保存してQR表示」を押してください</div>
  </div>

  <div class="history-header">
    <h3 style="font-size: 0.95rem; margin:0;">📋 履歴（<span id="historyCount">0件</span>）</h3>
    <div style="display: flex; gap: 4px;">
      <button class="btn-action btn-combine" onclick="generateCombinedQR()">まとめQR</button>
      <button class="btn-action btn-delete-sub" onclick="deleteSelectedHistory()">選択削除</button>
      <button class="btn-action btn-clear" onclick="clearHistory()">全削除</button>
    </div>
  </div>
  <div class="history-list" id="historyList"></div>

  <script>
    const STORAGE_KEY = 'qr_input_history_v7';

    window.onload = function() {
      renderHistory();
    };

    function parseNumber(val) {
      if (!val) return 0;
      const cleanVal = val.toString().replace(/[^0-9.]/g, '');
      const num = parseFloat(cleanVal);
      return isNaN(num) ? 0 : num;
    }

    // 単一項目の文字列化（頭ゼロ保護）処理
    function formatValue(val, isForceString) {
      if (!val) return "";
      // 数字のみかつ「0」から始まる場合は先頭にシングルクォートを自動付加
      if (isForceString && /^\d+$/.test(val) && val.length > 1) {
        return `'${val}`;
      }
      return val;
    }

    // 1行分の成形
    function parseSingleLine(rawLine, isForceString) {
      const items = rawLine.split(/[,、\t]/).map(i => i.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, ''));
      if (items.length === 0 || (items.length === 1 && items[0] === "")) return null;

      // 1項目だけ（2600002046 などの単体コード入力）の場合は純粋なコードのみ出力
      if (items.length === 1) {
        const singleVal = formatValue(items[0], isForceString);
        return { formatted: singleVal, qty: 0, pName: items[0], pPo: "" };
      }

      const pName = formatValue(items[0] || "", isForceString);
      const qty   = parseNumber(items[1]);
      const pPo   = formatValue(items[2] || "", isForceString);

      // ダブルクォーテーションなしのタブ区切り
      const formatted = [pName, qty, pPo].join('\t');
      
      return { formatted, qty, pName: items[0], pPo: items[2] || "" };
    }

    function processAndSave() {
      const inputEl = document.getElementById('inputText');
      const isForceString = document.getElementById('forceString').checked;
      const rawText = inputEl.value;
      if (!rawText.trim()) return;

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const now = new Date();
      const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

      let formattedLines = [];
      let lineQtySum = 0;
      let lastPName = "";
      let lastPPo = "";

      lines.forEach(line => {
        const parsed = parseSingleLine(line, isForceString);
        if (parsed) {
          formattedLines.push(parsed.formatted);
          lineQtySum += parsed.qty;
          lastPName = parsed.pName;
          lastPPo = parsed.pPo;
        }
      });

      if (formattedLines.length === 0) return;

      const finalQrText = formattedLines.join('\n');
      renderQR(finalQrText);
      document.getElementById('qrStatus').innerText = `生成完了 (${lines.length}件分 / ${timeStr})`;

      saveToHistory({
        timestamp: timeStr,
        raw: rawText,
        formatted: finalQrText,
        count: lines.length,
        qty: Math.round(lineQtySum * 100) / 100
      });

      // 複数項目入力時のみ連続入力ダイアログを表示
      if (lines.length === 1 && !rawText.includes(',') && !rawText.includes('、')) {
        inputEl.value = "";
      } else {
        if (confirm(`同じ品名・注番で複製しますか？\n（品名: ${lastPName} / 注番: ${lastPPo}）`)) {
          if (lastPPo) {
            inputEl.value = `${lastPName},,${lastPPo}`;
            const pos = lastPName.length + 1;
            setTimeout(() => {
              inputEl.focus();
              inputEl.setSelectionRange(pos, pos);
            }, 50);
          } else {
            inputEl.value = `${lastPName},`;
            setTimeout(() => {
              inputEl.focus();
            }, 50);
          }
        } else {
          inputEl.value = "";
        }
      }
    }

    function editHistory(index) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!history[index]) return;

      const isForceString = document.getElementById('forceString').checked;
      const currentRaw = history[index].raw;
      const newRaw = prompt("入力内容を修正してください（複数行も可）:", currentRaw);

      if (newRaw === null) return;
      if (!newRaw.trim()) {
        alert("空文字での保存はできません。削除したい場合は「選択削除」を使用してください。");
        return;
      }

      const lines = newRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let formattedLines = [];
      let lineQtySum = 0;

      lines.forEach(line => {
        const parsed = parseSingleLine(line, isForceString);
        if (parsed) {
          formattedLines.push(parsed.formatted);
          lineQtySum += parsed.qty;
        }
      });

      history[index].raw = newRaw;
      history[index].formatted = formattedLines.join('\n');
      history[index].count = lines.length;
      history[index].qty = Math.round(lineQtySum * 100) / 100;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
      
      renderQR(history[index].formatted);
      document.getElementById('qrStatus').innerText = `履歴を更新・再表示しました`;
    }

    function generateCombinedQR() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("まとめ出力したい履歴にチェックを入れてください。");
        return;
      }

      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      let combinedLines = [];

      checkboxes.forEach(cb => {
        const index = parseInt(cb.dataset.index);
        if (history[index]) {
          combinedLines.push(history[index].formatted);
        }
      });

      const finalQrText = combinedLines.join('\n');
      renderQR(finalQrText);
      document.getElementById('qrStatus').innerText = `選択履歴のまとめQR生成完了 (${checkboxes.length}件分)`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSelectedHistory() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("削除したい履歴にチェックを入れてください。");
        return;
      }

      if (confirm(`${checkboxes.length} 件の履歴を削除しますか？`)) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
        
        history = history.filter((_, index) => !indexesToDelete.includes(index));
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    function renderQR(text) {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      history.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      const listContainer = document.getElementById('historyList');
      document.getElementById('historyCount').innerText = `${history.length}件`;

      let totalQty = 0;

      listContainer.innerHTML = "";
      if (history.length === 0) {
        listContainer.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem; text-align:center; padding:10px;">履歴はありません</div>';
      } else {
        history.forEach((item, index) => {
          totalQty += (item.qty || 0);

          const no = history.length - index;
          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <input type="checkbox" class="history-checkbox" data-index="${index}">
            <div class="history-content">
              <div class="history-card-header">
                <span>[No. ${String(no).padStart(2, '0')}] ${item.count > 1 ? `(${item.count}件一括)` : ''}</span>
                <span>${item.timestamp}</span>
              </div>
              <div class="history-data">${item.raw.replace(/\n/g, ' / ')}</div>
            </div>
            <button class="btn-edit" onclick="editHistory(${index})">✏️ 編集</button>
          `;

          card.querySelector('.history-content').onclick = function() {
            renderQR(item.formatted);
            document.getElementById('qrStatus').innerText = `再出力 [No. ${String(no).padStart(2, '0')}] (${item.timestamp})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          listContainer.appendChild(card);
        });
      }

      document.getElementById('totalQty').innerText = (Math.round(totalQty * 100) / 100).toLocaleString();
    }

    function clearHistory() {
      if (confirm("全ての入力履歴を削除しますか？")) {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('qrcode').innerHTML = "";
        document.getElementById('qrStatus').innerText = "データを入力して「保存してQR表示」を押してください";
        renderHistory();
      }
    }
  </script>
</body>
</html>
