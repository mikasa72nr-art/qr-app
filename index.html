<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場QR入力 ＆ 集計管理アプリ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --card-bg: rgba(20, 15, 30, 0.75);
      --card-border: rgba(255, 183, 77, 0.3);
      --accent-green: #00E676;
      --accent-orange: #FF6D00;
      --accent-blue: #29B6F6;
      --accent-yellow: #FFD600;
      --text-main: #FFFFFF;
      --text-sub: #FFE0B2;
      --border-color: rgba(255, 255, 255, 0.2);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      padding-bottom: 60px;
      color: var(--text-main);
      min-height: 100vh;
      background-image: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    /* ヘッダー＆ハンバーガーメニュー */
    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .menu-toggle-btn {
      background: rgba(20, 15, 30, 0.8);
      border: 1px solid var(--card-border);
      color: #FFB74D;
      font-size: 1.4rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h2 { font-size: 1.1rem; color: #FFB74D; margin: 0; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

    /* サイドスライドメニュー */
    .side-menu {
      position: fixed;
      top: 0; left: -280px; width: 260px; height: 100%;
      background: rgba(15, 10, 25, 0.92);
      border-right: 1px solid var(--card-border);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 2000;
      transition: left 0.3s ease;
      padding: 20px 15px;
      box-sizing: border-box;
      box-shadow: 4px 0 25px rgba(0,0,0,0.7);
    }
    .side-menu.open { left: 0; }
    .side-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .btn-close-menu {
      background: none;
      border: none;
      color: #FFF;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .menu-item-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
    }
    .menu-item-btn.active {
      background: rgba(255, 109, 0, 0.4);
      border-color: rgba(255, 183, 77, 0.6);
      color: #FFB74D;
    }

    .menu-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
    }
    .menu-overlay.open { display: block; }

    /* 全画面背景鑑賞オーバーレイ */
    .view-sea-prompt {
      display: none;
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #FFF;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }

    .summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .summary-title { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-value { font-size: 2rem; font-weight: bold; color: var(--accent-yellow); text-shadow: 0 0 10px rgba(255,214,0,0.4); }

    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-top: 8px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    textarea, input[type="text"], input[type="number"] {
      width: 100%;
      font-size: 0.95rem;
      padding: 10px;
      box-sizing: border-box;
      background-color: rgba(10, 5, 15, 0.75);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 4px;
    }
    textarea { height: 90px; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: var(--accent-orange); }

    .wms-field-group {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }
    .wms-seq-badge {
      font-size: 0.75rem;
      color: var(--accent-yellow);
      background-color: rgba(255, 214, 0, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .symbol-btn-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-sym {
      background-color: rgba(255, 109, 0, 0.3);
      color: #FFB74D;
      border: 1px solid rgba(255, 183, 77, 0.4);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-sym:active {
      background-color: var(--accent-orange);
      color: #FFF;
    }

    .input-guide-bar {
      background-color: rgba(20, 10, 30, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #FFB74D;
      font-weight: bold;
    }

    .option-bar {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn-main {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, #FF6D00 0%, #E65100 100%);
      color: #FFF;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 109, 0, 0.5);
    }
    .btn-main:active { opacity: 0.85; }

    .qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
    }
    #qrcode {
      background-color: #FFFFFF;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }
    #qrcode img, #qrcode canvas {
      width: 250px !important;
      height: 250px !important;
      display: block;
      image-rendering: pixelated;
    }
    .qr-info { font-size: 0.8rem; color: #FFF; margin-top: 8px; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .btn-action {
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-combine { background-color: var(--accent-blue); color: #000; }
    .btn-delete-sub { background-color: #FF9800; color: #000; }
    .btn-clear { background-color: #D32F2F; color: #FFF; }

    .history-list { margin-top: 10px; }
    .history-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 4px solid var(--accent-orange);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-card.done { border-left-color: var(--accent-green); }
    .history-checkbox { width: 20px; height: 20px; accent-color: var(--accent-orange); }
    .history-content { flex: 1; cursor: pointer; }
    .history-card-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .history-data { font-weight: bold; word-break: break-all; }
    
    .status-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-badge.pending { background-color: rgba(255, 109, 0, 0.3); color: #FFB74D; }
    .status-badge.done { background-color: rgba(0, 230, 118, 0.3); color: var(--accent-green); }

    .btn-edit {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--accent-blue);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>

<body onclick="handleGlobalClick(event)">

  <!-- サイドメニューオーバーレイ -->
  <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu(false)"></div>

  <!-- サイドスライドメニュー -->
  <div id="sideMenu" class="side-menu">
    <div class="side-menu-header">
      <span style="font-weight:bold; color:#FFB74D;">⚙️ アプリ設定・モード</span>
      <button class="btn-close-menu" onclick="toggleMenu(false)">✕</button>
    </div>

    <label style="margin-top:0; margin-bottom:6px;">入力モード選択</label>
    <button id="menuBtnGeneral" class="menu-item-btn active" onclick="switchMode('general')">📄 汎用モード</button>
    <button id="menuBtnWms" class="menu-item-btn" onclick="switchMode('wms')">⚡ WMS高速モード</button>

    <hr style="border-color: var(--border-color); margin: 20px 0;">

    <button class="menu-item-btn" style="background: rgba(0,230,118,0.2); border-color: var(--accent-green); color: var(--accent-green);" onclick="hideUiAndShowSea()">🌅 画面を閉じて海を見る</button>
  </div>

  <!-- メインUIラップ -->
  <div id="mainUi">
    <div class="app-header">
      <button class="menu-toggle-btn" onclick="toggleMenu(true)">☰</button>
      <h2>🌅 現場QR入力 ＆ 集計管理</h2>
    </div>

    <div class="summary-card">
      <div class="summary-title">現在のトータル数量</div>
      <div class="summary-value" id="totalQty">0</div>
    </div>

    <!-- 汎用モード用エリア -->
    <div id="generalFormArea">
      <div class="input-guide-bar">
        📌 入力順: 品名 ➔ 数量 ➔ 注番
      </div>
      <label for="inputText">データ入力（カンマ区切り / スペース自動削除）</label>
      <textarea id="inputText" placeholder="コード番号: 01707300, 56, A234556&#10;または単体コード: 2600002046"></textarea>

      <div class="option-bar">
        <input type="checkbox" id="forceString" checked>
        <label for="forceString" style="display:inline; margin:0; cursor:pointer;">Excel頭ゼロ保持（数字品番の先頭に ' を付与）</label>
      </div>
    </div>

    <!-- WMS高速モード用エリア（制御キー固定順） -->
    <div id="wmsFormArea" style="display:none;">
      <div class="input-guide-bar">
        ⚡ WMSキーフロー固定: 品番 ➔ [↓] ➔ [Enter] ➔ 数量 ➔ ロット ➔ [Tab×5] ➔ 付属キー1 ➔ 付属キー2 ➔ [Tab]
      </div>

      <div class="wms-field-group">
        <label>1. 品番 <span class="wms-seq-badge">➔ 自動 [↓] [Enter]</span></label>
        <input type="text" id="wmsPName" placeholder="コード番号: 01707300 または単体コード: 2600002046">

        <label>2. 数量</label>
        <input type="number" id="wmsQty" placeholder="数量を入力: 56">

        <label>3. ロット番号 <span class="wms-seq-badge">➔ 自動 [Tab×5]</span></label>
        <input type="text" id="wmsLot" placeholder="例: 26/RTT-026-01" style="text-transform: uppercase;" autocapitalize="characters">
        <div class="symbol-btn-group">
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsLot', '/', event)" ontouchstart="insertSymbol('wmsLot', '/', event)">/</button>
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsLot', '-', event)" ontouchstart="insertSymbol('wmsLot', '-', event)">-</button>
        </div>

        <label>4. 付属キー1</label>
        <input type="text" id="wmsKey1" placeholder="付属キー1を入力" style="text-transform: uppercase;" autocapitalize="characters">
        <div class="symbol-btn-group">
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsKey1', '/', event)" ontouchstart="insertSymbol('wmsKey1', '/', event)">/</button>
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsKey1', '-', event)" ontouchstart="insertSymbol('wmsKey1', '-', event)">-</button>
        </div>

        <label>5. 付属キー2 <span class="wms-seq-badge">➔ 自動 [Tab]（次行へ移動）</span></label>
        <input type="text" id="wmsKey2" placeholder="付属キー2を入力" style="text-transform: uppercase;" autocapitalize="characters">
        <div class="symbol-btn-group">
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsKey2', '/', event)" ontouchstart="insertSymbol('wmsKey2', '/', event)">/</button>
          <button type="button" class="btn-sym" onmousedown="insertSymbol('wmsKey2', '-', event)" ontouchstart="insertSymbol('wmsKey2', '-', event)">-</button>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-main" onclick="processAndSave()">保存してQR表示</button>
    </div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
      <div class="qr-info" id="qrStatus">データを入力して「保存してQR表示」を押してください</div>
    </div>

    <div class="history-header">
      <h3 style="font-size: 0.95rem; margin:0; text-shadow:0 1px 3px rgba(0,0,0,0.8);">📋 履歴（<span id="historyCount">0件</span>）</h3>
      <div style="display: flex; gap: 4px;">
        <button class="btn-action btn-combine" onclick="generateCombinedQR()">まとめQR</button>
        <button class="btn-action btn-delete-sub" onclick="deleteSelectedHistory()">選択削除</button>
        <button class="btn-action btn-clear" onclick="clearHistory()">全削除</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="viewSeaPrompt" class="view-sea-prompt">画面をタップするとメニューに戻ります</div>

  <script>
    const STORAGE_KEY = 'qr_input_history_v17';
    let currentMode = 'general';
    let isSeaOnlyMode = false;

    const DOWN_ARROW = '\x04';
    const ENTER_KEY  = '\n';
    const TAB_KEY    = '\t';

    window.onload = function() {
      renderHistory();
    };

    function toggleMenu(open) {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      if (open) {
        menu.classList.add('open');
        overlay.classList.add('open');
      } else {
        menu.classList.remove('open');
        overlay.classList.remove('open');
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnGeneral = document.getElementById('menuBtnGeneral');
      const btnWms = document.getElementById('menuBtnWms');
      const areaGeneral = document.getElementById('generalFormArea');
      const areaWms = document.getElementById('wmsFormArea');

      if (mode === 'wms') {
        btnGeneral.classList.remove('active');
        btnWms.classList.add('active');
        areaGeneral.style.display = 'none';
        areaWms.style.display = 'block';
      } else {
        btnWms.classList.remove('active');
        btnGeneral.classList.add('active');
        areaWms.style.display = 'none';
        areaGeneral.style.display = 'block';
      }
      toggleMenu(false);
    }

    // UI非表示・夕日の海のみ表示
    function hideUiAndShowSea() {
      toggleMenu(false);
      document.getElementById('mainUi').style.display = 'none';
      document.getElementById('viewSeaPrompt').style.display = 'block';
      setTimeout(() => { isSeaOnlyMode = true; }, 100);
    }

    function handleGlobalClick(e) {
      if (isSeaOnlyMode) {
        document.getElementById('mainUi').style.display = 'block';
        document.getElementById('viewSeaPrompt').style.display = 'none';
        isSeaOnlyMode = false;
      }
    }

    function insertSymbol(elementId, symbol, event) {
      if (event) event.preventDefault();

      const input = document.getElementById(elementId);
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const text = input.value;

      input.value = text.substring(0, start) + symbol + text.substring(end);
      input.setSelectionRange(start + 1, start + 1);
    }

    function parseNumber(val) {
      if (!val) return 0;
      const cleanVal = val.toString().replace(/[^0-9.]/g, '');
      const num = parseFloat(cleanVal);
      return isNaN(num) ? 0 : num;
    }

    function formatValue(val, isForceString) {
      if (!val) return "";
      if (isForceString && /^\d+$/.test(val) && val.length > 1) {
        return `'${val}`;
      }
      return val;
    }

    function parseGeneralLine(rawLine, isForceString) {
      const items = rawLine.split(/[,、\t]/).map(i => i.trim().replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, ''));
      if (items.length === 0 || (items.length === 1 && items[0] === "")) return null;

      if (items.length === 1) {
        const singleVal = formatValue(items[0], isForceString);
        return { formatted: singleVal, qty: 0, pName: items[0], pPo: "" };
      }

      const pName = formatValue(items[0] || "", isForceString);
      const qty   = parseNumber(items[1]);
      const pPo   = formatValue(items[2] || "", isForceString);

      const formatted = [pName, qty, pPo].join(TAB_KEY);
      return { formatted, qty, pName: items[0], pPo: items[2] || "" };
    }

    function parseWmsData(pName, qtyStr, lotStr, key1, key2) {
      const cleanPName = pName.trim();
      const qtyNum     = parseNumber(qtyStr);
      const cleanLot   = lotStr.trim().toUpperCase();
      const cleanKey1  = key1.trim().toUpperCase();
      const cleanKey2  = key2.trim().toUpperCase();

      if (!cleanPName) return null;

      const tab5 = TAB_KEY.repeat(5);
      const formatted = `${cleanPName}${DOWN_ARROW}${ENTER_KEY}${qtyNum}${cleanLot}${tab5}${cleanKey1}${cleanKey2}${TAB_KEY}`;
      const rawSummary = `[WMS] ${cleanPName} / Qty:${qtyNum} / Lot:${cleanLot} / K1:${cleanKey1} / K2:${cleanKey2}`;

      return {
        formatted,
        qty: qtyNum,
        rawSummary,
        pName: cleanPName,
        lot: cleanLot,
        key1: cleanKey1,
        key2: cleanKey2
      };
    }

    function processAndSave() {
      const now = new Date();
      const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

      if (currentMode === 'wms') {
        const pName  = document.getElementById('wmsPName').value;
        const qtyStr = document.getElementById('wmsQty').value;
        const lotStr = document.getElementById('wmsLot').value;
        const key1   = document.getElementById('wmsKey1').value;
        const key2   = document.getElementById('wmsKey2').value;

        const parsed = parseWmsData(pName, qtyStr, lotStr, key1, key2);
        if (!parsed) {
          alert("品番を入力してください。");
          return;
        }

        document.getElementById('wmsLot').value = parsed.lot;
        document.getElementById('wmsKey1').value = parsed.key1;
        document.getElementById('wmsKey2').value = parsed.key2;

        renderQR(parsed.formatted);
        document.getElementById('qrStatus').innerText = `WMS高速QR生成完了 [出力済み] (${timeStr})`;

        saveToHistory({
          mode: 'wms',
          timestamp: timeStr,
          raw: parsed.rawSummary,
          formatted: parsed.formatted,
          wmsData: { pName: parsed.pName, qty: parsed.qty, lot: parsed.lot, key1: parsed.key1, key2: parsed.key2 },
          count: 1,
          qty: parsed.qty,
          isExported: true
        });

        if (confirm(`同じ品番・ロット・付属キーで複製しますか？\n（品番: ${parsed.pName} / ロット: ${parsed.lot}）`)) {
          document.getElementById('wmsQty').value = "";
          setTimeout(() => { document.getElementById('wmsQty').focus(); }, 50);
        } else {
          document.getElementById('wmsPName').value = "";
          document.getElementById('wmsQty').value = "";
          document.getElementById('wmsLot').value = "";
          document.getElementById('wmsKey1').value = "";
          document.getElementById('wmsKey2').value = "";
        }

      } else {
        const inputEl = document.getElementById('inputText');
        const isForceString = document.getElementById('forceString').checked;
        const rawText = inputEl.value;
        if (!rawText.trim()) return;

        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return;

        let formattedLines = [];
        let lineQtySum = 0;
        let lastPName = "";
        let lastPPo = "";

        lines.forEach(line => {
          const parsed = parseGeneralLine(line, isForceString);
          if (parsed) {
            formattedLines.push(parsed.formatted);
            lineQtySum += parsed.qty;
            lastPName = parsed.pName;
            lastPPo = parsed.pPo;
          }
        });

        if (formattedLines.length === 0) return;

        const finalQrText = formattedLines.join(ENTER_KEY);
        renderQR(finalQrText);
        document.getElementById('qrStatus').innerText = `生成完了 [出力済み] (${lines.length}件分 / ${timeStr})`;

        saveToHistory({
          mode: 'general',
          timestamp: timeStr,
          raw: rawText,
          formatted: finalQrText,
          count: lines.length,
          qty: Math.round(lineQtySum * 100) / 100,
          isExported: true
        });

        if (lines.length === 1 && !rawText.includes(',') && !rawText.includes('、')) {
          inputEl.value = "";
        } else {
          if (confirm(`同じ品名・注番で複製しますか？\n（品名: ${lastPName} / 注番: ${lastPPo}）`)) {
            if (lastPPo) {
              inputEl.value = `${lastPName},,${lastPPo}`;
              const pos = lastPName.length + 1;
              setTimeout(() => {
                inputEl.focus();
                inputEl.setSelectionRange(pos, pos);
              }, 50);
            } else {
              inputEl.value = `${lastPName},`;
              setTimeout(() => { inputEl.focus(); }, 50);
            }
          } else {
            inputEl.value = "";
          }
        }
      }
    }

    function markAsExported(index) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (history[index]) {
        history[index].isExported = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    function editHistory(index) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!history[index]) return;

      const record = history[index];

      if (record.mode === 'wms' && record.wmsData) {
        const newPName = prompt("品番（コード番号/単体コード）を編集してください:", record.wmsData.pName);
        if (newPName === null) return;
        const newQty = prompt("数量を編集してください:", record.wmsData.qty);
        if (newQty === null) return;
        const newLot = prompt("ロット番号を編集してください:", record.wmsData.lot || "");
        if (newLot === null) return;
        const newKey1 = prompt("付属キー1を編集してください:", record.wmsData.key1);
        if (newKey1 === null) return;
        const newKey2 = prompt("付属キー2を編集してください:", record.wmsData.key2);
        if (newKey2 === null) return;

        const parsed = parseWmsData(newPName, newQty, newLot, newKey1, newKey2);
        if (!parsed) return;

        record.raw = parsed.rawSummary;
        record.formatted = parsed.formatted;
        record.qty = parsed.qty;
        record.wmsData = { pName: parsed.pName, qty: parsed.qty, lot: parsed.lot, key1: parsed.key1, key2: parsed.key2 };

      } else {
        const isForceString = document.getElementById('forceString').checked;
        const newRaw = prompt("入力内容を修正してください（複数行も可）:", record.raw);
        if (newRaw === null || !newRaw.trim()) return;

        const lines = newRaw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let formattedLines = [];
        let lineQtySum = 0;

        lines.forEach(line => {
          const parsed = parseGeneralLine(line, isForceString);
          if (parsed) {
            formattedLines.push(parsed.formatted);
            lineQtySum += parsed.qty;
          }
        });

        record.raw = newRaw;
        record.formatted = formattedLines.join(ENTER_KEY);
        record.count = lines.length;
        record.qty = Math.round(lineQtySum * 100) / 100;
      }

      history[index] = record;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
      
      renderQR(record.formatted);
      document.getElementById('qrStatus').innerText = `履歴を更新・再表示しました`;
    }

    function generateCombinedQR() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("まとめ出力したい履歴にチェックを入れてください。");
        return;
      }

      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      let combinedLines = [];

      checkboxes.forEach(cb => {
        const index = parseInt(cb.dataset.index);
        if (history[index]) {
          combinedLines.push(history[index].formatted);
          history[index].isExported = true;
        }
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();

      const finalQrText = combinedLines.join(ENTER_KEY);
      renderQR(finalQrText);
      document.getElementById('qrStatus').innerText = `選択履歴のまとめQR生成完了 [出力済み] (${checkboxes.length}件分)`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSelectedHistory() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("削除したい履歴にチェックを入れてください。");
        return;
      }

      if (confirm(`${checkboxes.length} 件の履歴を削除しますか？`)) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
        history = history.filter((_, index) => !indexesToDelete.includes(index));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    function renderQR(text) {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      history.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      const listContainer = document.getElementById('historyList');
      document.getElementById('historyCount').innerText = `${history.length}件`;

      let totalQty = 0;

      listContainer.innerHTML = "";
      if (history.length === 0) {
        listContainer.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem; text-align:center; padding:10px;">履歴はありません</div>';
      } else {
        history.forEach((item, index) => {
          totalQty += (item.qty || 0);

          const no = history.length - index;
          const isDone = item.isExported;
          const card = document.createElement('div');
          card.className = `history-card ${isDone ? 'done' : ''}`;
          card.innerHTML = `
            <input type="checkbox" class="history-checkbox" data-index="${index}">
            <div class="history-content">
              <div class="history-card-header">
                <span>[No. ${String(no).padStart(2, '0')}] ${item.mode === 'wms' ? '⚡WMS' : '📄汎用'} <span class="status-badge ${isDone ? 'done' : 'pending'}">${isDone ? '済' : '未出力'}</span></span>
                <span>${item.timestamp}</span>
              </div>
              <div class="history-data">${item.raw.replace(/\n/g, ' / ')}</div>
            </div>
            <button class="btn-edit" onclick="editHistory(${index})">✏️ 編集</button>
          `;

          card.querySelector('.history-content').onclick = function() {
            renderQR(item.formatted);
            markAsExported(index);
            document.getElementById('qrStatus').innerText = `再出力 [済] [No. ${String(no).padStart(2, '0')}] (${item.timestamp})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          listContainer.appendChild(card);
        });
      }

      document.getElementById('totalQty').innerText = (Math.round(totalQty * 100) / 100).toLocaleString();
    }

    function clearHistory() {
      if (confirm("全ての入力履歴を削除しますか？")) {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('qrcode').innerHTML = "";
        document.getElementById('qrStatus').innerText = "データを入力して「保存してQR表示」を押してください";
        renderHistory();
      }
    }
  </script>
</body>
</html>
