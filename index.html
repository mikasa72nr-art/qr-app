<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場QR入力 ＆ カスタム集計アプリ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --accent-green: #00E676;
      --accent-orange: #FF6D00;
      --accent-blue: #29B6F6;
      --accent-yellow: #FFD600;
      --text-main: #FFFFFF;
      --text-sub: #AAAAAA;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding-bottom: 60px;
    }
    h2 { font-size: 1.1rem; color: var(--accent-green); margin: 0 0 10px 0; }
    
    .summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .summary-item { flex: 1; }
    .summary-item:first-child { border-right: 1px solid var(--border-color); }
    .summary-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-value { font-size: 1.4rem; font-weight: bold; }
    .val-qty { color: var(--accent-yellow); }
    .val-weight { color: var(--accent-green); }

    label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-top: 8px; }
    textarea, select {
      width: 100%;
      font-size: 1rem;
      padding: 10px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-top: 4px;
    }
    textarea { height: 90px; resize: vertical; }
    textarea:focus, select:focus { outline: none; border-color: var(--accent-green); }
    
    .config-box {
      background-color: var(--card-bg);
      border: 1px dashed var(--accent-blue);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
    }
    .config-title { font-size: 0.8rem; color: var(--accent-blue); font-weight: bold; margin-bottom: 6px; }
    .order-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .order-tag {
      background: #2A2A2A;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-order { background: none; border: none; color: var(--accent-green); font-size: 0.8rem; cursor: pointer; padding: 0 2px; }

    .preset-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .btn-save-preset {
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 0 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .input-guide-bar {
      background-color: #263238;
      border: 1px solid #37474F;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--accent-green);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-main {
      flex: 1;
      padding: 14px;
      background-color: var(--accent-orange);
      color: #FFF;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-main:active { opacity: 0.8; }

    .qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
    }
    #qrcode {
      background-color: #FFFFFF;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
    }
    #qrcode img, #qrcode canvas {
      width: 250px !important;
      height: 250px !important;
      display: block;
      image-rendering: pixelated;
    }
    .qr-info { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; text-align: center; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .btn-action {
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-combine { background-color: var(--accent-blue); color: #000; }
    .btn-delete-sub { background-color: #FF9800; color: #000; }
    .btn-clear { background-color: #D32F2F; color: #FFF; }

    .history-list { margin-top: 10px; }
    .history-card {
      background-color: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid var(--accent-green);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .history-checkbox { width: 20px; height: 20px; accent-color: var(--accent-blue); }
    .history-content { flex: 1; cursor: pointer; }
    .history-card-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .history-data { font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

  <h2>📱 現場データ入力 ＆ 集計管理</h2>

  <div class="summary-card">
    <div class="summary-item">
      <div class="summary-title">現在のトータル数量</div>
      <div class="summary-value val-qty" id="totalQty">0</div>
    </div>
    <div class="summary-item">
      <div class="summary-title">現在のトータル重量</div>
      <div class="summary-value val-weight" id="totalWeight">0.0 kg</div>
    </div>
  </div>

  <div class="config-box">
    <div class="config-title">⚙️ 項目セット（フォーマット選択）</div>
    <div class="preset-row">
      <select id="presetSelect" onchange="changePreset()">
        <option value="default">標準セット（品名 ➔ ロット ➔ 注番 ➔ 数量 ➔ 重量）</option>
        <option value="weight_only">簡易重量セット（品名 ➔ 重量のみ）</option>
        <option value="cloud">クラウド在庫用（注番 ➔ 品名 ➔ ロット ➔ 数量 ➔ 重量 ➔ 日時）</option>
      </select>
      <button class="btn-save-preset" onclick="saveCustomPreset()">現在の並びを保存</button>
    </div>
    <div class="config-title" style="margin-top:6px;">並び順の微調整（「←」「→」で変更）</div>
    <div class="order-list" id="orderList"></div>
  </div>

  <div class="input-guide-bar">
    <span>📌 入力順:</span>
    <span id="guideText">品名 ➔ ロット ➔ 注番 ➔ 数量 ➔ 重量</span>
  </div>

  <label for="inputText">データ入力（品名, 重量のみの入力も自動判定）</label>
  <textarea id="inputText" placeholder="【全入力例】ボルトM6, LOT123, PO-999, 10, 30.2&#10;【重量のみ例】端材パーツ, 15.8"></textarea>

  <div class="btn-group">
    <button class="btn-main" onclick="processAndSave()">保存してQR表示</button>
  </div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
    <div class="qr-info" id="qrStatus">データを入力して「保存してQR表示」を押してください</div>
  </div>

  <div class="history-header">
    <h3 style="font-size: 0.95rem; margin:0;">📋 履歴（<span id="historyCount">0件</span>）</h3>
    <div style="display: flex; gap: 4px;">
      <button class="btn-action btn-combine" onclick="generateCombinedQR()">まとめQR</button>
      <button class="btn-action btn-delete-sub" onclick="deleteSelectedHistory()">選択削除</button>
      <button class="btn-action btn-clear" onclick="clearHistory()">全削除</button>
    </div>
  </div>
  <div class="history-list" id="historyList"></div>

  <script>
    const STORAGE_KEY = 'qr_input_history_v3';
    const ORDER_KEY = 'qr_field_order_v1';
    const PRESETS_KEY = 'qr_custom_presets_v1';

    let fieldOrder = ['name', 'lot', 'po', 'qty', 'weight', 'time'];
    const fieldLabels = {
      name: '品名',
      lot: 'ロット',
      po: '注番',
      qty: '数量',
      weight: '重量',
      time: '登録日時'
    };

    const defaultPresets = {
      default: ['name', 'lot', 'po', 'qty', 'weight', 'time'],
      weight_only: ['name', 'weight', 'lot', 'po', 'qty', 'time'],
      cloud: ['po', 'name', 'lot', 'qty', 'weight', 'time']
    };

    window.onload = function() {
      loadPresetsUI();
      const savedOrder = localStorage.getItem(ORDER_KEY);
      if (savedOrder) {
        fieldOrder = JSON.parse(savedOrder);
      }
      renderOrderUI();
      renderHistory();
    };

    function loadPresetsUI() {
      const select = document.getElementById('presetSelect');
      const customPresets = JSON.parse(localStorage.getItem(PRESETS_KEY) || "{}");
      
      select.innerHTML = `
        <option value="default">標準セット（品名 ➔ ロット ➔ 注番 ➔ 数量 ➔ 重量）</option>
        <option value="weight_only">簡易重量セット（品名 ➔ 重量のみ）</option>
        <option value="cloud">クラウド在庫用（注番 ➔ 品名 ➔ ロット ➔ 数量 ➔ 重量 ➔ 日時）</option>
      `;

      Object.keys(customPresets).forEach(key => {
        const option = document.createElement('option');
        option.value = `custom_${key}`;
        option.innerText = `★ ${key}`;
        select.appendChild(option);
      });
    }

    function changePreset() {
      const val = document.getElementById('presetSelect').value;
      if (defaultPresets[val]) {
        fieldOrder = [...defaultPresets[val]];
      } else if (val.startsWith('custom_')) {
        const key = val.replace('custom_', '');
        const customPresets = JSON.parse(localStorage.getItem(PRESETS_KEY) || "{}");
        if (customPresets[key]) {
          fieldOrder = [...customPresets[key]];
        }
      }
      saveAndRefreshOrder();
    }

    function saveCustomPreset() {
      const name = prompt("現在の並び順セットの名前を入力してください（例: 簡易重量用）");
      if (!name || !name.trim()) return;

      let customPresets = JSON.parse(localStorage.getItem(PRESETS_KEY) || "{}");
      customPresets[name.trim()] = [...fieldOrder];
      localStorage.setItem(PRESETS_KEY, JSON.stringify(customPresets));
      
      loadPresetsUI();
      document.getElementById('presetSelect').value = `custom_${name.trim()}`;
      alert(`「${name.trim()}」セットを保存しました！`);
    }

    function renderOrderUI() {
      const container = document.getElementById('orderList');
      container.innerHTML = "";
      
      let guideItems = [];

      fieldOrder.forEach((key, index) => {
        const tag = document.createElement('div');
        tag.className = 'order-tag';
        tag.innerHTML = `
          <span>${fieldLabels[key]}</span>
          ${index > 0 ? `<button class="btn-order" onclick="moveField(${index}, -1)">←</button>` : ''}
          ${index < fieldOrder.length - 1 ? `<button class="btn-order" onclick="moveField(${index}, 1)">→</button>` : ''}
        `;
        container.appendChild(tag);

        if (key !== 'time') {
          guideItems.push(fieldLabels[key]);
        }
      });

      document.getElementById('guideText').innerText = guideItems.join(' ➔ ');
    }

    function moveField(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= fieldOrder.length) return;
      const temp = fieldOrder[index];
      fieldOrder[index] = fieldOrder[targetIndex];
      fieldOrder[targetIndex] = temp;
      saveAndRefreshOrder();
    }

    function saveAndRefreshOrder() {
      localStorage.setItem(ORDER_KEY, JSON.stringify(fieldOrder));
      renderOrderUI();
    }

    function parseNumber(val) {
      if (!val) return 0;
      const num = parseFloat(val.toString().replace(/[^0-9.]/g, ''));
      return isNaN(num) ? 0 : num;
    }

    // 1行分の成形（「品名, 重量」の2要素入力への柔軟対応）
    function parseSingleLine(rawLine, timeStr) {
      const items = rawLine.split(/[,、\t]/).map(i => i.trim());
      if (items.length === 0 || (items.length === 1 && items[0] === "")) return null;

      let dataMap = { name: "", lot: "", po: "", qty: 0, weight: 0, time: timeStr };

      // 要素が2つだけで、2つ目が数値（または小数）の場合は「品名, 重量」と自動判別
      if (items.length === 2 && !isNaN(parseFloat(items[1]))) {
        dataMap.name = items[0];
        dataMap.weight = parseNumber(items[1]);
      } else {
        dataMap.name = items[0] || "";
        dataMap.lot = items[1] || "";
        dataMap.po = items[2] || "";
        dataMap.qty = parseNumber(items[3]);
        dataMap.weight = parseNumber(items[4]);
      }

      const orderedItems = fieldOrder.map(key => {
        const val = dataMap[key];
        return (val !== undefined && val !== null) ? val : "";
      });

      const formatted = orderedItems.map(item => `"${item}"`).join('\t');
      return { formatted, qty: dataMap.qty, weight: dataMap.weight };
    }

    function processAndSave() {
      const rawText = document.getElementById('inputText').value;
      if (!rawText.trim()) return;

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return;

      const now = new Date();
      const timeStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

      let formattedLines = [];
      let lineQtySum = 0;
      let lineWeightSum = 0;

      lines.forEach(line => {
        const parsed = parseSingleLine(line, timeStr);
        if (parsed) {
          formattedLines.push(parsed.formatted);
          lineQtySum += parsed.qty;
          lineWeightSum += parsed.weight;
        }
      });

      if (formattedLines.length === 0) return;

      const finalQrText = formattedLines.join('\n');
      renderQR(finalQrText);
      document.getElementById('qrStatus').innerText = `生成完了 (${lines.length}件分 / ${timeStr})`;

      saveToHistory({
        timestamp: timeStr,
        raw: rawText,
        formatted: finalQrText,
        count: lines.length,
        qty: lineQtySum,
        weight: Math.round(lineWeightSum * 100) / 100
      });

      document.getElementById('inputText').value = "";
    }

    function generateCombinedQR() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("まとめ出力したい履歴にチェックを入れてください。");
        return;
      }

      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      let combinedLines = [];

      checkboxes.forEach(cb => {
        const index = parseInt(cb.dataset.index);
        if (history[index]) {
          combinedLines.push(history[index].formatted);
        }
      });

      const finalQrText = combinedLines.join('\n');
      renderQR(finalQrText);
      document.getElementById('qrStatus').innerText = `選択履歴のまとめQR生成完了 (${checkboxes.length}件分)`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSelectedHistory() {
      const checkboxes = document.querySelectorAll('.history-checkbox:checked');
      if (checkboxes.length === 0) {
        alert("削除したい履歴にチェックを入れてください。");
        return;
      }

      if (confirm(`${checkboxes.length} 件の履歴を削除しますか？`)) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const indexesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index));
        
        history = history.filter((_, index) => !indexesToDelete.includes(index));
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    function renderQR(text) {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      history.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      const listContainer = document.getElementById('historyList');
      document.getElementById('historyCount').innerText = `${history.length}件`;

      let totalQty = 0;
      let totalWeight = 0;

      listContainer.innerHTML = "";
      if (history.length === 0) {
        listContainer.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem; text-align:center; padding:10px;">履歴はありません</div>';
      } else {
        history.forEach((item, index) => {
          totalQty += (item.qty || 0);
          totalWeight += (item.weight || 0);

          const no = history.length - index;
          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <input type="checkbox" class="history-checkbox" data-index="${index}">
            <div class="history-content">
              <div class="history-card-header">
                <span>[No. ${String(no).padStart(2, '0')}] ${item.count > 1 ? `(${item.count}件一括)` : ''}</span>
                <span>${item.timestamp}</span>
              </div>
              <div class="history-data">${item.raw.replace(/\n/g, ' / ')}</div>
            </div>
          `;

          card.querySelector('.history-content').onclick = function() {
            renderQR(item.formatted);
            document.getElementById('qrStatus').innerText = `再出力 [No. ${String(no).padStart(2, '0')}] (${item.timestamp})`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          listContainer.appendChild(card);
        });
      }

      document.getElementById('totalQty').innerText = totalQty.toLocaleString();
      document.getElementById('totalWeight').innerText = `${(Math.round(totalWeight * 100) / 100).toLocaleString()} kg`;
    }

    function clearHistory() {
      if (confirm("全ての入力履歴を削除しますか？")) {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('qrcode').innerHTML = "";
        document.getElementById('qrStatus').innerText = "データを入力して「保存してQR表示」を押してください";
        renderHistory();
      }
    }
  </script>
</body>
</html>
